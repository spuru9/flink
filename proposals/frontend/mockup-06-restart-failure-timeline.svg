<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
     role="img" aria-label="Restart and failure timeline">
  <rect x="0" y="0" width="960" height="260" fill="#fff"/>

  <!-- time grid -->
  <g stroke="#eef1f5">
    <line x1="90"  y1="30" x2="90"  y2="210"/>
    <line x1="250" y1="30" x2="250" y2="210"/>
    <line x1="410" y1="30" x2="410" y2="210"/>
    <line x1="570" y1="30" x2="570" y2="210"/>
    <line x1="730" y1="30" x2="730" y2="210"/>
    <line x1="890" y1="30" x2="890" y2="210"/>
  </g>
  <g fill="#6b7280" font-size="11" text-anchor="middle">
    <text x="90"  y="226">-120m</text>
    <text x="250" y="226">-90m</text>
    <text x="410" y="226">-60m</text>
    <text x="570" y="226">-30m</text>
    <text x="730" y="226">-15m</text>
    <text x="890" y="226">now</text>
  </g>

  <!-- lane labels -->
  <text x="10" y="60"  font-size="12" fill="#1f2937">Job status</text>
  <text x="10" y="100" font-size="12" fill="#1f2937">Attempt #</text>
  <text x="10" y="160" font-size="12" fill="#1f2937">Failures</text>

  <!-- job status bars -->
  <!-- attempt 1: running 0-35m -->
  <rect x="90"  y="50" width="120" height="18" fill="#52c41a" rx="3"/>
  <text x="95"  y="63" font-size="11" fill="#fff">attempt 1 · RUNNING</text>
  <!-- failure marker -->
  <line x1="210" y1="44" x2="210" y2="74" stroke="#ff4d4f" stroke-width="2"/>
  <polygon points="210,38 204,48 216,48" fill="#ff4d4f"/>

  <!-- attempt 2: running 35-95m -->
  <rect x="215" y="50" width="315" height="18" fill="#52c41a" rx="3"/>
  <text x="220" y="63" font-size="11" fill="#fff">attempt 2 · RUNNING</text>
  <line x1="530" y1="44" x2="530" y2="74" stroke="#ff4d4f" stroke-width="2"/>
  <polygon points="530,38 524,48 536,48" fill="#ff4d4f"/>

  <!-- attempt 3: short, restarting 95-98m -->
  <rect x="535" y="50" width="28" height="18" fill="#faad14" rx="3"/>
  <text x="540" y="63" font-size="11" fill="#fff">init</text>
  <line x1="563" y1="44" x2="563" y2="74" stroke="#ff4d4f" stroke-width="2"/>
  <polygon points="563,38 557,48 569,48" fill="#ff4d4f"/>

  <!-- attempt 4: running 98m - now -->
  <rect x="568" y="50" width="322" height="18" fill="#52c41a" rx="3"/>
  <text x="573" y="63" font-size="11" fill="#fff">attempt 4 · RUNNING (current)</text>

  <!-- attempt-number row -->
  <g font-size="12" fill="#6b7280">
    <text x="150" y="104">1</text>
    <text x="365" y="104">2</text>
    <text x="549" y="104">3</text>
    <text x="720" y="104">4</text>
  </g>

  <!-- failures -->
  <!-- f1: OOM at -85m -->
  <g transform="translate(210,120)">
    <rect x="0" y="0" width="180" height="42" fill="#fff1f0" stroke="#ffa39e" rx="4"/>
    <text x="10" y="16" font-size="11" fill="#d4380d" font-weight="600">java.lang.OutOfMemoryError</text>
    <text x="10" y="32" font-size="10" fill="#6b7280">TM-3  KeyedAgg[4]  -85m</text>
  </g>
  <!-- f2: conn refused at -25m -->
  <g transform="translate(378,120)">
    <rect x="0" y="0" width="180" height="42" fill="#fff1f0" stroke="#ffa39e" rx="4"/>
    <text x="10" y="16" font-size="11" fill="#d4380d" font-weight="600">java.net.ConnectException</text>
    <text x="10" y="32" font-size="10" fill="#6b7280">Sink → jdbc  -25m</text>
  </g>
  <!-- f3: checkpoint timeout at -22m -->
  <g transform="translate(562,120)">
    <rect x="0" y="0" width="190" height="42" fill="#fff1f0" stroke="#ffa39e" rx="4"/>
    <text x="10" y="16" font-size="11" fill="#d4380d" font-weight="600">CheckpointExpiredException</text>
    <text x="10" y="32" font-size="10" fill="#6b7280">checkpoint #147 timed out  -22m</text>
  </g>

  <!-- legend -->
  <g transform="translate(90,188)" font-size="11" fill="#6b7280">
    <rect x="0"   y="0" width="10" height="10" fill="#52c41a"/>
    <text x="14"  y="9">running</text>
    <rect x="80"  y="0" width="10" height="10" fill="#faad14"/>
    <text x="94"  y="9">initializing</text>
    <rect x="170" y="0" width="10" height="10" fill="#ff4d4f"/>
    <text x="184" y="9">failure event</text>
    <rect x="280" y="0" width="10" height="10" fill="#fff1f0" stroke="#ffa39e"/>
    <text x="294" y="9">exception preview (click to expand stack)</text>
  </g>
</svg>
