<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
     role="img" aria-label="Data-skew heatmap on operator list">
  <rect x="0" y="0" width="1000" height="440" fill="#fff"/>

  <!-- toolbar -->
  <g>
    <text x="16" y="28" font-size="14" font-weight="600">Operators (job: click-stream-enrich)</text>

    <!-- metric picker -->
    <g transform="translate(636,12)">
      <text x="0" y="16" font-size="11" fill="#6b7280">metric</text>
      <rect x="38" y="0" width="200" height="24" fill="#fafafa" stroke="#e5e7eb" rx="4"/>
      <text x="48" y="16" font-size="12">busyTimeMsPerSecond</text>
      <polygon points="222,10 230,10 226,16" fill="#6b7280"/>
    </g>
    <!-- normalization toggle -->
    <g transform="translate(852,12)">
      <rect x="0"  y="0" width="66" height="24" fill="#e6f4ff" stroke="#91caff" rx="4"/>
      <text x="10" y="16" font-size="11" fill="#0958d9">per-op ·</text>
      <rect x="66" y="0" width="66" height="24" fill="#fff" stroke="#e5e7eb" rx="4"/>
      <text x="76" y="16" font-size="11" fill="#6b7280">per-job</text>
    </g>
  </g>

  <!-- column headers -->
  <g transform="translate(16,58)" font-size="11" fill="#6b7280">
    <text x="0"   y="0">Operator</text>
