  <!-- footnote -->
  <g transform="translate(16,388)">
    <text x="0" y="0"  font-size="11" fill="#6b7280">Legend: cell intensity = busy time, normalized per operator. Hover a cell for subtask index + exact value. Click → jump to subtask drawer.</text>
    <text x="0" y="18" font-size="11" fill="#6b7280">Skew chip: <tspan fill="#cf1322">red &gt; 3×</tspan>, <tspan fill="#d46b08">amber &gt; 1.5×</tspan>, hidden below 1.5×.</text>
  </g>
