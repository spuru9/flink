    <rect x="0" y="0" width="968" height="48" fill="#fafafa" stroke="#e5e7eb" rx="4"/>
    <text x="14" y="20" font-size="13" font-weight="600">JDBCSink</text>
    <text x="14" y="36" font-size="11" fill="#6b7280">parallelism 8 · sink</text>

    <g transform="translate(284,14)">
      <rect x="0"   y="0" width="53" height="20" fill="#91caff"/>
      <rect x="54"  y="0" width="53" height="20" fill="#69b1ff"/>
      <rect x="108" y="0" width="53" height="20" fill="#91caff"/>
