<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
     role="img" aria-label="Backpressure heatmap on job DAG">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#8c8c8c"/>
    </marker>
    <linearGradient id="bpGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%"   stop-color="#f0f0f0"/>
      <stop offset="30%"  stop-color="#ffe7ba"/>
      <stop offset="60%"  stop-color="#faad14"/>
      <stop offset="100%" stop-color="#cf1322"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="400" fill="#fff"/>

  <!-- Toolbar: overlay picker -->
  <g transform="translate(16,16)">
    <text x="0" y="16" font-size="11" fill="#6b7280">overlay</text>
    <g transform="translate(44,0)">
      <rect x="0"  y="0" width="72" height="24" fill="#fff" stroke="#e5e7eb" rx="4"/>
      <text x="14" y="16" font-size="11" fill="#6b7280">Status</text>
    </g>
    <g transform="translate(120,0)">
      <rect x="0"  y="0" width="110" height="24" fill="#fff1f0" stroke="#ffa39e" rx="4"/>
      <text x="12" y="16" font-size="11" fill="#cf1322" font-weight="600">Backpressure</text>
    </g>
    <g transform="translate(234,0)">
      <rect x="0"  y="0" width="84" height="24" fill="#fff" stroke="#e5e7eb" rx="4"/>
      <text x="12" y="16" font-size="11" fill="#6b7280">Busy time</text>
    </g>

    <!-- gradient legend -->
    <g transform="translate(740,0)">
      <text x="0" y="16" font-size="11" fill="#6b7280">0%</text>
      <rect x="22" y="6" width="160" height="12" fill="url(#bpGradient)" stroke="#e5e7eb"/>
      <text x="188" y="16" font-size="11" fill="#6b7280">100%  backpressured</text>
    </g>
  </g>

  <!-- edges -->
  <g stroke="#8c8c8c" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="196" y1="170" x2="258" y2="170"/>
    <line x1="376" y1="170" x2="438" y2="170"/>
    <line x1="556" y1="170" x2="618" y2="170"/>
    <line x1="736" y1="170" x2="798" y2="170"/>
  </g>

  <!-- Node 1: KafkaSource — red -->
  <g transform="translate(76,120)">
    <rect x="0" y="0" width="120" height="100" fill="#ff7875" stroke="#cf1322" stroke-width="1.5" rx="6"/>
    <text x="60" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">KafkaSource</text>
    <text x="60" y="40" text-anchor="middle" font-size="10" fill="#fff">par 16 · source</text>
    <rect x="10" y="56" width="100" height="32" fill="rgba(255,255,255,0.2)" rx="4"/>
    <text x="16" y="68" font-size="10" fill="#fff">bp  ████████░</text>
    <text x="16" y="82" font-size="10" fill="#fff">82% backpressured</text>
  </g>

  <!-- Node 2: Parse — red -->
  <g transform="translate(258,120)">
    <rect x="0" y="0" width="120" height="100" fill="#ff7875" stroke="#cf1322" stroke-width="1.5" rx="6"/>
    <text x="60" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Parse (flatMap)</text>
    <text x="60" y="40" text-anchor="middle" font-size="10" fill="#fff">par 16 · stateless</text>
    <rect x="10" y="56" width="100" height="32" fill="rgba(255,255,255,0.2)" rx="4"/>
    <text x="16" y="68" font-size="10" fill="#fff">bp  ████████░</text>
    <text x="16" y="82" font-size="10" fill="#fff">79% backpressured</text>
  </g>

  <!-- Node 3: KeyedAgg — red -->
  <g transform="translate(438,120)">
    <rect x="0" y="0" width="120" height="100" fill="#ff7875" stroke="#cf1322" stroke-width="1.5" rx="6"/>
    <text x="60" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">KeyedAgg</text>
    <text x="60" y="40" text-anchor="middle" font-size="10" fill="#fff">par 16 · stateful</text>
    <rect x="10" y="56" width="100" height="32" fill="rgba(255,255,255,0.2)" rx="4"/>
    <text x="16" y="68" font-size="10" fill="#fff">bp  ███████░░</text>
    <text x="16" y="82" font-size="10" fill="#fff">71% backpressured</text>
  </g>

  <!-- Node 4: Window — amber -->
  <g transform="translate(618,120)">
    <rect x="0" y="0" width="120" height="100" fill="#ffd591" stroke="#d46b08" stroke-width="1.5" rx="6"/>
    <text x="60" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">Window[60s]</text>
    <text x="60" y="40" text-anchor="middle" font-size="10" fill="#7c2d12">par 16 · stateful</text>
    <rect x="10" y="56" width="100" height="32" fill="rgba(255,255,255,0.35)" rx="4"/>
    <text x="16" y="68" font-size="10" fill="#7c2d12">bp  ███░░░░░░</text>
    <text x="16" y="82" font-size="10" fill="#7c2d12">28% backpressured</text>
  </g>

  <!-- Node 5: JDBCSink — NOT backpressured (the bottleneck) -->
  <g transform="translate(798,120)">
    <rect x="-4" y="-4" width="128" height="108" fill="none" stroke="#1677ff" stroke-width="1.5" stroke-dasharray="4 3" rx="8"/>
    <rect x="0" y="0" width="120" height="100" fill="#f0f0f0" stroke="#8c8c8c" stroke-width="1.5" rx="6"/>
    <text x="60" y="22" text-anchor="middle" font-size="12" font-weight="600">JDBCSink</text>
    <text x="60" y="40" text-anchor="middle" font-size="10" fill="#6b7280">par 8 · sink</text>
    <rect x="10" y="56" width="100" height="32" fill="#fafafa" rx="4"/>
    <text x="16" y="68" font-size="10">bp  ░░░░░░░░░</text>
    <text x="16" y="82" font-size="10" fill="#6b7280">4% · busy 970</text>
    <g transform="translate(12,-24)">
      <rect x="0"  y="0" width="96" height="18" fill="#1677ff" rx="9"/>
      <text x="48" y="13" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">bottleneck</text>
    </g>
  </g>

  <!-- Hover-tooltip example -->
  <g transform="translate(432,240)">
    <rect x="0" y="0" width="340" height="130" fill="#fff" stroke="#e5e7eb" rx="6" filter="url(#shadow)"/>
    <text x="12" y="20" font-size="12" font-weight="600">KeyedAgg · backpressure per subtask</text>
    <text x="12" y="36" font-size="10" fill="#6b7280">sampled just now · 16 subtasks · bar = bp ratio</text>

    <g transform="translate(12,48)">
      <rect x="0"   y="20" width="14" height="30" fill="#faad14"/>
      <rect x="20"  y="14" width="14" height="36" fill="#ff7875"/>
      <rect x="40"  y="10" width="14" height="40" fill="#ff7875"/>
      <rect x="60"  y="18" width="14" height="32" fill="#faad14"/>
      <rect x="80"  y="12" width="14" height="38" fill="#ff7875"/>
      <rect x="100" y="8"  width="14" height="42" fill="#ff4d4f"/>
      <rect x="120" y="14" width="14" height="36" fill="#ff7875"/>
      <rect x="140" y="2"  width="14" height="48" fill="#cf1322"/>
      <rect x="160" y="10" width="14" height="40" fill="#ff7875"/>
      <rect x="180" y="14" width="14" height="36" fill="#ff7875"/>
      <rect x="200" y="18" width="14" height="32" fill="#faad14"/>
      <rect x="220" y="12" width="14" height="38" fill="#ff7875"/>
      <rect x="240" y="14" width="14" height="36" fill="#ff7875"/>
      <rect x="260" y="16" width="14" height="34" fill="#ff7875"/>
      <rect x="280" y="20" width="14" height="30" fill="#faad14"/>
      <rect x="300" y="22" width="14" height="28" fill="#faad14"/>

      <line x1="0" y1="52" x2="314" y2="52" stroke="#e5e7eb"/>
    </g>

    <g transform="translate(12,112)" font-size="10" fill="#6b7280">
      <text x="0"   y="0">0</text>
      <text x="80"  y="0">4</text>
      <text x="160" y="0">8</text>
      <text x="240" y="0">12</text>
      <text x="304" y="0" text-anchor="end">15</text>
    </g>
  </g>

  <!-- reading-rule callout -->
  <g transform="translate(16,336)">
    <rect x="0" y="0" width="380" height="48" fill="#e6f4ff" stroke="#91caff" rx="4"/>
    <text x="12" y="18" font-size="12" font-weight="600" fill="#0958d9">Reading rule</text>
    <text x="12" y="36" font-size="11" fill="#003a8c">Bottleneck = first non-red vertex downstream of the red zone (here: JDBCSink).</text>
  </g>
</svg>
