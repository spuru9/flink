<svg
  class="lag-sparkline"
  [class.alerting]="isAlerting"
  [attr.width]="width"
  [attr.height]="height"
  [attr.viewBox]="'0 0 ' + width + ' ' + height"
  preserveAspectRatio="none"
  role="img"
  [attr.aria-label]="ariaLabel"
>
  <rect
    *ngIf="hasData && alertBandY !== null"
    class="alert-band"
    x="0"
    [attr.y]="alertBandY"
    [attr.width]="width"
    [attr.height]="height - alertBandY"
  />
  <polyline *ngIf="hasData" class="line" [attr.points]="points" fill="none" />
  <text *ngIf="!hasData" x="2" [attr.y]="height - 4" class="empty">—</text>
</svg>
