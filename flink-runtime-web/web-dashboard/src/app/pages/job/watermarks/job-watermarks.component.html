<div class="watermarks-layout">
  <div class="chart-pane">
    <div class="chart-header">
      <span class="title">Watermark lag</span>
      <span class="threshold">alert &gt; {{ thresholdSeconds }}s</span>
    </div>
    <div class="chart-host" #chartContainer></div>
    <div class="chart-empty" *ngIf="!hasAnyData">
      <nz-empty
        nzNotFoundContent="Collecting watermark samples… give it a refresh tick or two."
      ></nz-empty>
    </div>
  </div>

  <div class="sidebar-pane">
    <ng-container *ngIf="cards.length === 0; else cardList">
      <nz-empty nzNotFoundContent="No vertices."></nz-empty>
    </ng-container>
    <ng-template #cardList>
      <nz-card
        *ngFor="let card of cards; trackBy: trackByVertexId"
        class="vertex-card"
        [class.selected]="selectedVertexId === card.vertexId"
        [class.elevated]="card.status === 'elevated'"
        [class.idle]="card.status === 'idle'"
        nzSize="small"
        (click)="selectVertex(card.vertexId)"
      >
        <div class="vertex-card__row">
          <span class="vertex-card__name" [title]="card.name">{{ card.name }}</span>
          <nz-tag
            class="vertex-card__status"
            [nzColor]="
              card.status === 'elevated'
                ? 'red'
                : card.status === 'tracked'
                ? 'orange'
                : card.status === 'healthy'
                ? 'green'
                : 'default'
            "
          >
            {{ card.status }}
          </nz-tag>
        </div>
        <div class="vertex-card__row vertex-card__metric">
          <span class="vertex-card__lag" *ngIf="card.status !== 'idle'; else idleLabel">
            {{ card.currentLagMs / 1000 | number: '1.1-1' }}s
            <span class="vertex-card__trend" [attr.data-trend]="card.trend">
              <ng-container [ngSwitch]="card.trend">
                <span *ngSwitchCase="'up'">▲</span>
                <span *ngSwitchCase="'down'">▼</span>
                <span *ngSwitchDefault>▬</span>
              </ng-container>
            </span>
          </span>
          <ng-template #idleLabel>
            <span class="vertex-card__lag vertex-card__lag--idle">idle</span>
          </ng-template>
          <flink-lag-sparkline
            [values]="card.values"
            [thresholdMs]="thresholdSeconds * 1000"
            [width]="80"
            [height]="20"
            [ariaLabel]="card.name + ' watermark lag sparkline'"
          ></flink-lag-sparkline>
        </div>
      </nz-card>
    </ng-template>
  </div>
</div>
